# https://rumdl.dev/

[global]  # Globally applied options
# Disable specific rules
disable = ["MD013", "MD033"]

# Add opt-in rules on top of defaults (additive)
extend-enable = ["MD060", "MD063"]

# Exclude files and directories
exclude = [
    ".github",
    "docs/assets/**",
    "overrides",
    "site",
    "*.tmp.md"
]

# Include only specific files
include = [
    "README.md",
    "docs/**/*.md"
]

# Files matching .gitignore patterns
respect-gitignore = true

# Set global line length (used by MD013 and other line-length rules)
line-length = 240

# Set markdown flavor (standard, gfm, mkdocs, mdx, pandoc, quarto, obsidian, kramdown, azure_devops)
flavor = "mkdocs"
# rules affected: MD024, MD031, MD033, MD038, MD040, MD042, MD046, MD049, MD050, MD052, MD056

# Disable specific rules for specific files
[per-file-ignores]
"README.md" = ["MD033"]  # Allow inline HTML in README
# "docs/api/**/*.md" = ["MD013", "MD041"]  # Generated API docs


# ------------------------------------------
# Markdown Rules

[MD009]
strict = true    # Remove all trailing spaces, even line breaks (default: false)

[MD010]
spaces-per-tab = 4    # Number of spaces to replace each tab with (default: 4)
code-blocks = true   # Skip tabs inside code blocks (default: false)

[MD012]
maximum = 1  # Maximum number of consecutive blank lines allowed (default: 1)

[MD013]  # Keep lines short for better readability
line-length = 240  # Maximum characters per line (default: 80, disable: 0)
code-blocks = true  # Don't check code blocks (default: true)
code-spans = false  # Don't flag lines whose only overflow is an unbreakable inline code span (default: true)
tables = false  # Don't check tables (default: false)
headings = true  # Check headings (default: true)
paragraphs = true  # Check paragraph/regular text (default: true)
blockquotes = true  # Check blockquote content (default: true)
strict = false  # Disables exceptions for URLs, etc. (default: false)
stern = false  # Like strict, but unwrappable single-token lines are still permitted (default: false)
ignore-link-urls = true  # Ignore inline link/image URLs when measuring line length (default: true)
heading-line-length = 100  # Optional per-context limit for headings; falls back to line-length when unset
code-block-line-length = 120  # Optional per-context limit for code blocks; falls back to line-length when unset
reflow = false  # Enable automatic text reflow/wrapping (default: false)
reflow-mode = "default"  # Reflow mode: "default", "normalize", "sentence-per-line", or "semantic-line-breaks" (default: "default")
length-mode = "visual"  # How to count line length: "visual", "chars", or "bytes" (default: "visual")
abbreviations = ["Assn", "Univ"]  # Add custom abbreviations for sentence-per-line mode
require-sentence-capital = true  # Require uppercase after periods for sentence detection (default: true)

[MD022]
lines-above = 2  # Blank lines required above headings (default: 1)
lines-below = 1  # Blank lines required below headings (default: 1)
